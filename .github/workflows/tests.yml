name: fixtures

# The gate runs here, after the push — never in a commit or push hook. A commit is a
# save and a push is a backup; neither is gated by tests.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  fixtures:
    runs-on: ubuntu-latest
    # Two fixtures exercise a real Codex `*** Update File:` patch and can only run
    # where the Codex CLI is installed, because the applier is Codex's own parser and
    # a second parser that disagrees with it would make the guard fail open. The
    # runner names every skip and refuses to go green on an undeclared one; the step
    # below asserts that the skipped set is exactly those two and has not grown.
    env:
      SO_ALLOW_MISSING: codex
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Versions
        run: bash --version | head -1; jq --version
      - name: bash -n over every script
        run: for f in scripts/*.sh scripts/lib/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - name: Red-first — every fixture must fail with its guard stubbed out
        run: bash tests/run.sh --red-first
      - name: Real — every fixture must pass against the real hooks
        run: bash tests/run.sh
      - name: Fail-closed guard census
        run: bash scripts/check-shell-safety.sh "$PWD"
      - name: The skipped set is exactly the two Codex-applier fixtures
        run: |
          set -euo pipefail
          got=$(bash tests/run.sh 2>&1 | grep '^  SKIP' | sed -E 's/^  SKIP  ([^ ]+) .*/\1/' | sort | tr '\n' ' ')
          want="F17-allow-real-update-patch-through-codex-applier F17-deny-real-update-patch-that-drops-a-constraint "
          echo "skipped: $got"
          test "$got" = "$want"
