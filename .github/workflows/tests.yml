name: fixtures

# The gate runs here, after the push — never in a commit or push hook. A commit is a
# save and a push is a backup; neither is gated by tests.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  fixtures:
    runs-on: ubuntu-latest
    # The suite must skip NOTHING. A fixture skipped for a missing dependency is
    # named by the runner and refuses to go green undeclared; the step below asserts
    # the skipped set is empty, so it cannot start growing silently.
    env:
      SO_ALLOW_MISSING: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Versions
        run: bash --version | head -1; jq --version
      - name: bash -n over every script
        run: for f in scripts/*.sh scripts/lib/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - name: The interpreter prompt ships
        run: test -s prompts/interpreter.md
      - name: Red-first — every fixture must fail with its guard stubbed out
        run: bash tests/run.sh --red-first
      - name: Real — every fixture must pass against the real hooks
        run: bash tests/run.sh
      - name: Fail-closed guard census
        run: bash scripts/check-shell-safety.sh "$PWD"
      - name: The Codex installer's red-first proof
        run: bash tests/test-install-codex.sh
      - name: Nothing is skipped
        run: |
          set -euo pipefail
          got=$(bash tests/run.sh 2>&1 | grep -c '^  SKIP' || true)
          echo "skipped fixtures: $got"
          test "$got" = "0"
